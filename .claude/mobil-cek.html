<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>mobil-cek</title>
<style>html,body{margin:0;background:#12140f}iframe{border:0;display:block}</style></head>
<body>
<iframe id="f"></iframe>
<script>
// ?u=/dugun/&w=390  → gerçek w piksel genişliğinde viewport, tam sayfa yüksekliği
var q=new URLSearchParams(location.search);
var u=q.get('u')||'/', w=parseInt(q.get('w')||'390',10);
var f=document.getElementById('f');
f.style.width=w+'px'; f.style.height='800px'; f.src=u;
f.onload=function(){
  setTimeout(function(){
    var d=f.contentDocument;
    // tüm açılır/kapanır içerikleri görünür yap ki tam yükseklik ölçülsün
    var h=Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
    f.style.height=h+'px';
    document.title='HAZIR-'+h;
  },1400);
};
</script></body></html>
